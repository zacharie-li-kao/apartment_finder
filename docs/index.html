<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home search</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--mut:#6b6a64;--line:#e4e1d8;--card:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171715;--fg:#eeece6;--mut:#9a978d;--line:#3a3934;--card:#22221f}}
:root[data-theme="dark"]{--bg:#171715;--fg:#eeece6;--mut:#9a978d;--line:#3a3934;--card:#22221f}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
nav{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
nav a{padding:8px 16px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:600;border:1px solid transparent}
nav a.on{color:var(--fg);border-color:var(--fg)}
nav small{margin-left:auto;align-self:center;color:var(--mut)}
iframe{flex:1;width:100%;border:0}
.hidden{display:none}
</style></head>
<body>
<nav>
  <a href="#apartments" id="t-apartments">Tokyo apartments (buy)</a>
  <a href="#houses" id="t-houses">Saitama houses</a>
  <small>Budget: flats ≤ 40M yen · houses ≤ 30M yen</small>
</nav>
<iframe id="f-apartments" src="apartments.html"></iframe>
<iframe id="f-houses" src="houses.html" class="hidden"></iframe>
<script>
// Hash tabs: #apartments or #houses. Each iframe loads its own report, untouched.
function show(){
  const tab = location.hash === "#houses" ? "houses" : "apartments";
  for (const t of ["apartments","houses"]) {
    document.getElementById("f-"+t).classList.toggle("hidden", t !== tab);
    document.getElementById("t-"+t).classList.toggle("on", t === tab);
  }
}
addEventListener("hashchange", show);
show();
</script>
</body></html>
